<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mirrorLog</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    max-width: 720px; margin: 0 auto; padding: 24px 16px 80px;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.7; font-size: 17px; color: #1a1a1a; background: #fff;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.desc { color: #666; font-size: 14px; margin-top: 0; }
  form { display: flex; gap: 8px; margin: 16px 0; }
  input[type="url"] { flex: 1; padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 10px 16px; font-size: 15px; border: none; border-radius: 6px; background: #03c75a; color: #fff; cursor: pointer; }
  button:disabled { background: #999; cursor: default; }
  #status { font-size: 13px; color: #888; min-height: 18px; }

  /* The fetched post renders inside a sandboxed iframe (its own document,
     with Naver's original stylesheets intact) instead of being spliced
     into this page — that's what keeps line spacing/image sizing correct.
     The iframe's sandbox attribute grants NOTHING (no allow-scripts,
     allow-forms, allow-same-origin, allow-top-navigation, ...), and its own
     document also gets a pointer-events:none override injected before it's
     shown, so nothing inside it is clickable even by accident. Because it
     has no allow-same-origin, we can't read its contentDocument to measure
     content height (see the script below) — so instead of auto-sizing to
     content, it's a fixed-height box that scrolls internally. */
  #mirror { width: 100%; height: 75vh; border: 1px solid #eee; border-radius: 8px; display: block; margin-top: 24px; }
</style>
</head>
<body>

<h1>mirrorLog</h1>
<p class="desc">네이버 블로그 글 주소를 넣으면 텍스트와 이미지만 읽기 전용으로 보여줍니다.</p>

<form id="form">
  <input id="url" type="url" placeholder="https://blog.naver.com/아이디/글번호" required>
  <button id="submit" type="submit">보기</button>
</form>
<div id="status"></div>

<!--
  sandbox with an empty value = every restriction on, nothing granted back.
  DO NOT add "allow-scripts" to this later without re-reading this comment:
  allow-same-origin + allow-scripts together let script running inside the
  frame reach out and script the parent document — i.e. take over this
  GitHub Pages origin — which fully defeats the sandbox. That combination is
  the one thing this attribute must never have both halves of at once. We
  don't need allow-same-origin at all right now (see the CSS comment above
  for why), so it isn't here; if a future feature seems to need it, that's
  a sign to redesign around postMessage instead, not to add the token.
-->
<iframe id="mirror" sandbox title="미러링된 글"></iframe>

<script>
(() => {
  const WORKER_URL = "https://mirrorlog.qwertyuiop26338884.workers.dev";
  // Symmetric AES-GCM key shared with the Worker (set there via `wrangler secret put`).
  // This page is static and public, so anyone can view-source and read this key —
  // it does NOT hide the destination from a determined reader of this file.
  // Its purpose is narrower: keep the blog URL out of plaintext query strings,
  // browser history, and request logs during normal use.
  const KEY_B64 = "qjmkpW1nlPE6zB2YMwHFFTnX4bbVtsIcxBytODbQzhs=";

  const form = document.getElementById("form");
  const input = document.getElementById("url");
  const submitBtn = document.getElementById("submit");
  const statusEl = document.getElementById("status");
  const mirror = document.getElementById("mirror");

  function bytesToBase64url(bytes) {
    let binary = "";
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  async function importKey() {
    const raw = Uint8Array.from(atob(KEY_B64), (c) => c.charCodeAt(0));
    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt"]);
  }

  async function encryptUrl(plainUrl) {
    const key = await importKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ciphertextBuf = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv },
      key,
      new TextEncoder().encode(plainUrl)
    );
    const combined = new Uint8Array(iv.length + ciphertextBuf.byteLength);
    combined.set(iv, 0);
    combined.set(new Uint8Array(ciphertextBuf), iv.length);
    return bytesToBase64url(combined);
  }

  const INERT_STYLE = "<style>*,*::before,*::after{pointer-events:none !important;}</style>";

  function renderMirror(html) {
    // Inject before </head> so it's the last head rule and wins ties.
    const withInert = html.includes("</head>")
      ? html.replace("</head>", INERT_STYLE + "</head>")
      : INERT_STYLE + html;

    // No contentDocument reach-in here — the frame has no allow-same-origin
    // (see the iframe's own comment), so there's nothing to measure from
    // out here. #mirror is a fixed-height box in CSS; it scrolls internally.
    mirror.srcdoc = withInert;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const rawUrl = input.value.trim();
    if (!rawUrl) return;

    submitBtn.disabled = true;
    statusEl.textContent = "불러오는 중...";
    mirror.removeAttribute("srcdoc");

    try {
      const d = await encryptUrl(rawUrl);
      const res = await fetch(`${WORKER_URL}/api/read?d=${encodeURIComponent(d)}`);
      if (!res.ok) throw new Error(await res.text());
      const html = await res.text();
      renderMirror(html);
      statusEl.textContent = "";
    } catch (err) {
      statusEl.textContent = "불러오기 실패: " + err.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
})();
</script>

</body>
</html>
